<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zen Pomodoro - Deepin OS Style</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter untuk UI Deepin yang bersih -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        deepin: {
                            blue: '#0056FF',
                            indigo: '#5E35B1',
                            glassLight: 'rgba(255, 255, 255, 0.65)',
                            glassDark: 'rgba(30, 30, 35, 0.65)',
                            borderLight: 'rgba(255, 255, 255, 0.5)',
                            borderDark: 'rgba(255, 255, 255, 0.08)'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar a la Deepin */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 9999px; }
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Ambient Dynamic Background (Deepin Style) */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.6;
            z-index: -1;
            animation: float 20s ease-in-out infinite alternate;
        }
        .dark .bg-orb { opacity: 0.25; }
        
        .orb-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #4facfe; }
        .orb-2 { bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: #00f2fe; animation-delay: -5s; }
        .orb-3 { top: 40%; left: 30%; width: 30vw; height: 30vw; background: #667eea; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 10%) scale(1.1); }
        }

        /* Glassmorphism Panel Deepin */
        .deepin-glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }
        .dark .deepin-glass {
            background: rgba(25, 25, 30, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Deepin Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #0056FF;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(148, 163, 184, 0.3);
            border-radius: 9999px;
        }
        .dark input[type=range]::-webkit-slider-runnable-track {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ODOMETER SLIDE ANIMATION */
        .digit-box {
            position: relative;
            width: 14vmin; 
            height: 20vmin;
            overflow: hidden; 
            display: inline-block;
        }
        .digit-text {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26vmin;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            user-select: none;
        }
        .colon {
            font-size: 22vmin;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 2vmin; 
            user-select: none;
            opacity: 0.5;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-[#0f1014] text-slate-800 dark:text-slate-100 flex items-center justify-center p-4 transition-colors duration-500 antialiased overflow-x-hidden selection:bg-blue-500 selection:text-white">

    <!-- Orba Latar Belakang Ala Deepin -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <!-- SETUP CONTAINER (Widget Style Deepin) -->
    <div id="setup-view" class="w-full max-w-[420px] my-auto transition-all duration-500 ease-[cubic-bezier(0.4,0,0.2,1)] z-10">
        
        <div class="w-full deepin-glass rounded-[32px] p-7 flex flex-col gap-7 relative transition-colors duration-300">
            
            <!-- HEADER & THEME TOGGLE -->
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-11 h-11 rounded-[14px] bg-gradient-to-br from-blue-500 to-indigo-500 text-white flex items-center justify-center shadow-lg shadow-blue-500/30">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white leading-tight">Waktu Fokus</h1>
                        <p class="text-[13px] font-medium text-slate-500 dark:text-slate-400">Deepin Productivity</p>
                    </div>
                </div>

                <button type="button" onclick="toggleTheme()" class="p-2.5 rounded-full bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 transition-all text-slate-700 dark:text-slate-200">
                    <svg id="theme-sun" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    <svg id="theme-moon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                </button>
            </div>

            <!-- DURATION SECTION -->
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <label class="text-[12px] font-bold tracking-widest text-slate-400 dark:text-slate-500 uppercase">Durasi (Menit)</label>
                </div>
                
                <div class="bg-black/5 dark:bg-white/5 p-1 rounded-[16px] grid grid-cols-4 gap-1">
                    <button type="button" onclick="setPreset(15)" class="preset-btn py-2 text-[13px] font-semibold rounded-[12px] text-slate-600 dark:text-slate-300 transition-all">15</button>
                    <button type="button" onclick="setPreset(25)" class="preset-btn active py-2 text-[13px] font-semibold rounded-[12px] bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-sm transition-all">25</button>
                    <button type="button" onclick="setPreset(45)" class="preset-btn py-2 text-[13px] font-semibold rounded-[12px] text-slate-600 dark:text-slate-300 transition-all">45</button>
                    <button type="button" onclick="setPreset(60)" class="preset-btn py-2 text-[13px] font-semibold rounded-[12px] text-slate-600 dark:text-slate-300 transition-all">60</button>

                    <button type="button" onclick="selectSound('river')" id="sound-river" class="sound-card flex flex-col items-center justify-center p-2.5 rounded-[16px] bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 text-slate-600 dark:text-slate-300 border border-transparent transition-all gap-1.5"><span class="text-xl">💧</span><span class="text-[10px] font-semibold truncate w-full text-center">Sungai</span></button>
                    <button type="button" onclick="selectSound('waves')" id="sound-waves" class="sound-card flex flex-col items-center justify-center p-2.5 rounded-[16px] bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 text-slate-600 dark:text-slate-300 border border-transparent transition-all gap-1.5"><span class="text-xl">🌊</span><span class="text-[10px] font-semibold truncate w-full text-center">Ombak</span></button>
                    <button type="button" onclick="selectSound('campfire')" id="sound-campfire" class="sound-card flex flex-col items-center justify-center p-2.5 rounded-[16px] bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 text-slate-600 dark:text-slate-300 border border-transparent transition-all gap-1.5"><span class="text-xl">🪵</span><span class="text-[10px] font-semibold truncate w-full text-center">Api</span></button>

                    <button type="button" onclick="selectSound('cafe')" id="sound-cafe" class="sound-card flex flex-col items-center justify-center p-2.5 rounded-[16px] bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 text-slate-600 dark:text-slate-300 border border-transparent transition-all gap-1.5"><span class="text-xl">☕</span><span class="text-[10px] font-semibold truncate w-full text-center">Kafe</span></button>
                    <button type="button" onclick="selectSound('alpha')" id="sound-alpha" class="sound-card flex flex-col items-center justify-center p-2.5 rounded-[16px] bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 text-slate-600 dark:text-slate-300 border border-transparent transition-all gap-1.5"><span class="text-xl">🧠</span><span class="text-[10px] font-semibold truncate w-full text-center">Fokus</span></button>
                    <button type="button" onclick="selectSound('space')" id="sound-space" class="sound-card flex flex-col items-center justify-center p-2.5 rounded-[16px] bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 text-slate-600 dark:text-slate-300 border border-transparent transition-all gap-1.5"><span class="text-xl">🌌</span><span class="text-[10px] font-semibold truncate w-full text-center">Kosmik</span></button>
                    <button type="button" onclick="selectSound('brown')" id="sound-brown" class="sound-card flex flex-col items-center justify-center p-2.5 rounded-[16px] bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 text-slate-600 dark:text-slate-300 border border-transparent transition-all gap-1.5"><span class="text-xl">🎧</span><span class="text-[10px] font-semibold truncate w-full text-center">Noise</span></button>

        <!-- Finish Modal (Deepin Glass) -->
        <div id="finish-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4 transition-opacity duration-300 opacity-0">
            <div class="deepin-glass rounded-[32px] p-8 max-w-sm w-full text-center space-y-4 scale-95 transition-transform duration-300" id="finish-modal-content">
                <div class="text-5xl mb-2">🎉</div>
                <h3 class="text-xl font-bold text-slate-900 dark:text-white">Selesai!</h3>
                <p class="text-sm font-medium text-slate-600 dark:text-slate-300">Waktu fokus telah berakhir. Istirahat sejenak.</p>
                <button onclick="closeFinishModal()" class="w-full mt-4 py-3.5 rounded-[16px] bg-blue-600 hover:bg-blue-500 text-white font-bold text-[14px] shadow-lg shadow-blue-500/30 transition-all">
                    Kembali
                </button>
            </div>
        </div>
    </div>

    <script>
        // WEB AUDIO SYNTHESIZER
        class AmbientSynthEngine {
            constructor() {
                this.ctx = null;
                this.volume = 0.5;
                this.gainNode = null;
                this.sourceNodes = [];
                this.intervalIds = [];
                this.isPlaying = false;
                this.isMuted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                    this.gainNode = this.ctx.createGain();
                    this.gainNode.gain.setValueAtTime(this.volume, this.ctx.currentTime);
                    this.gainNode.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }

            setVolume(val) {
                this.volume = parseFloat(val);
                if (this.gainNode && !this.isMuted) {
                    this.gainNode.gain.setTargetAtTime(this.volume, this.ctx.currentTime, 0.05);
                }
            }

            toggleMute() {
                this.isMuted = !this.isMuted;
                if (this.gainNode) {
                    this.gainNode.gain.setTargetAtTime(this.isMuted ? 0 : this.volume, this.ctx.currentTime, 0.05);
                }
                return this.isMuted;
            }

            stop() {
                this.isPlaying = false;
                this.intervalIds.forEach(id => { clearInterval(id); clearTimeout(id); });
                this.intervalIds = [];
                this.sourceNodes.forEach(node => { try { node.stop(); node.disconnect(); } catch(e){} });
                this.sourceNodes = [];
            }

            createNoise(type) {
                const bufferSize = 2 * this.ctx.sampleRate;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = buffer.getChannelData(0);
                
                if (type === 'white') {
                    for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                } else if (type === 'pink') {
                    let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
                    for (let i = 0; i < bufferSize; i++) {
                        const white = Math.random() * 2 - 1;
                        b0 = 0.99886 * b0 + white * 0.0555179;
                        b1 = 0.99332 * b1 + white * 0.0750759;
                        b2 = 0.96900 * b2 + white * 0.1538520;
                        b3 = 0.86650 * b3 + white * 0.3104856;
                        b4 = 0.55000 * b4 + white * 0.5329522;
                        b5 = -0.7616 * b5 - white * 0.0168980;
                        output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                        output[i] *= 0.11;
                        b6 = white * 0.115926;
                    }
                } else if (type === 'brown') {
                    let lastOut = 0;
                    for (let i = 0; i < bufferSize; i++) {
                        const white = Math.random() * 2 - 1;
                        output[i] = (lastOut + (0.02 * white)) / 1.02;
                        lastOut = output[i];
                        output[i] *= 3.5;
                    }
                }
                const source = this.ctx.createBufferSource();
                source.buffer = buffer;
                source.loop = true;
                return source;
            }

            play(soundType) {
                this.init();
                this.stop();
                if (soundType === 'none') return;
                this.isPlaying = true;

                if (soundType === 'rain') {
                    const noise = this.createNoise('pink');
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass'; filter.frequency.value = 800;
                    noise.connect(filter); filter.connect(this.gainNode);
                    noise.start(); this.sourceNodes.push(noise);
                }
                else if (soundType === 'thunder') {
                    const noise = this.createNoise('brown');
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass'; filter.frequency.value = 400;
                    noise.connect(filter); filter.connect(this.gainNode);
                    noise.start(); this.sourceNodes.push(noise);
                }
                else {
                    const noise = this.createNoise('brown');
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass'; filter.frequency.value = 300;
                    noise.connect(filter); filter.connect(this.gainNode);
                    noise.start(); this.sourceNodes.push(noise);
                }
            }

            playChime() {
                this.init();
                const freqs = [523.25, 659.25, 783.99]; 
                freqs.forEach((freq, idx) => {
                    setTimeout(() => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 2.0);
                        osc.connect(gain); gain.connect(this.gainNode);
                        osc.start(); osc.stop(this.ctx.currentTime + 2.0);
                    }, idx * 150);
                });
            }
        }

        const soundEngine = new AmbientSynthEngine();
        let focusMinutes = 25;
        let selectedSound = 'rain';
        let timerInterval = null;
        let remainingSeconds = 0;
        let isPaused = false;
        let uiFadeTimeout = null;

        const soundInfo = {
            'rain': { name: 'Hujan', icon: '🌧️' },
            'thunder': { name: 'Badai', icon: '⛈️' },
            'river': { name: 'Sungai', icon: '💧' },
            'waves': { name: 'Ombak', icon: '🌊' },
            'campfire': { name: 'Api', icon: '🪵' },
            'wind': { name: 'Angin', icon: '🍃' },
            'crickets': { name: 'Malam', icon: '🦗' },
            'cafe': { name: 'Kafe', icon: '☕' },
            'space': { name: 'Kosmik', icon: '🌌' },
            'alpha': { name: 'Fokus', icon: '🧠' },
            'brown': { name: 'Noise', icon: '🎧' },
            'clock': { name: 'Jam', icon: '⏱️' },
            'none': { name: 'Hening', icon: '🔕' }
        };

        // Theme Toggle (Light/Dark Mode)
        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            document.getElementById('theme-sun').classList.toggle('hidden');
            document.getElementById('theme-moon').classList.toggle('hidden');
        }

        // Inputs
        document.getElementById('custom-duration').addEventListener('input', (e) => {
            let val = parseInt(e.target.value);
            if (isNaN(val) || val < 1) val = 1;
            focusMinutes = val;
            
            document.querySelectorAll('.preset-btn').forEach(btn => {
                const isActive = btn.textContent === String(val);
                if (isActive) {
                    btn.className = "preset-btn active py-2 text-[13px] font-semibold rounded-[12px] bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-sm transition-all";
                } else {
                    btn.className = "preset-btn py-2 text-[13px] font-semibold rounded-[12px] text-slate-600 dark:text-slate-300 transition-all";
                }
            });
        });

        document.getElementById('volume-slider').addEventListener('input', (e) => {
            soundEngine.setVolume(e.target.value);
        });

        function setPreset(mins) {
            focusMinutes = mins;
            document.getElementById('custom-duration').value = mins;
            
            document.querySelectorAll('.preset-btn').forEach(btn => {
                const isActive = btn.textContent === String(mins);
                if (isActive) {
                    btn.className = "preset-btn active py-2 text-[13px] font-semibold rounded-[12px] bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-sm transition-all";
                } else {
                    btn.className = "preset-btn py-2 text-[13px] font-semibold rounded-[12px] text-slate-600 dark:text-slate-300 transition-all";
                }
            });
        }

        function selectSound(soundKey) {
            selectedSound = soundKey;
            document.querySelectorAll('.sound-card').forEach(card => {
                card.className = "sound-card flex flex-col items-center justify-center p-2.5 rounded-[16px] bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 text-slate-600 dark:text-slate-300 border border-transparent transition-all gap-1.5";
            });
            const active = document.getElementById(`sound-${soundKey}`);
            if (active) active.className = "sound-card active flex flex-col items-center justify-center p-2.5 rounded-[16px] bg-blue-500/10 dark:bg-blue-500/20 text-blue-600 dark:text-blue-400 border border-blue-500/20 transition-all gap-1.5 shadow-sm";
        }

        function updateDigit(elementId, newValue) {
            const container = document.getElementById(elementId);
            const currentValStr = container.dataset.value;
            const newValStr = String(newValue);

            // Jika angka sama, abaikan
            if (currentValStr === newValStr && container.innerHTML !== '') return;
            
            container.dataset.value = newValStr;

            if (document.hidden) {
                container.innerHTML = `<span class="digit-text text-slate-900 dark:text-white current">${newValStr}</span>`;
                return;
            }

            const currentDigit = container.querySelector('.digit-text.current');
            
            // Buat angka baru (berada di atas)
            const newDigit = document.createElement('span');
            newDigit.className = 'digit-text next text-blue-500 dark:text-blue-400';
            newDigit.innerText = newValStr;
            newDigit.style.transform = 'translateY(-100%)';
            
            container.appendChild(newDigit);

            // Angka lama terdorong ke BAWAH
            if (currentDigit) {
                const animOut = currentDigit.animate([
                    { transform: 'translateY(0)', opacity: 1, filter: 'blur(0)' },
                    { transform: 'translateY(100%)', opacity: 0, filter: 'blur(4px)' }
                ], { duration: 450, easing: 'cubic-bezier(0.4, 0.0, 0.2, 1)', fill: 'forwards' });
                animOut.onfinish = () => currentDigit.remove();
            }

            // Angka baru masuk dari ATAS ke TENGAH
            const animIn = newDigit.animate([
                { transform: 'translateY(-100%)', opacity: 0, filter: 'blur(4px)' },
                { transform: 'translateY(0)', opacity: 1, filter: 'blur(0)' }
            ], { duration: 450, easing: 'cubic-bezier(0.4, 0.0, 0.2, 1)', fill: 'forwards' });

            animIn.onfinish = () => {
                newDigit.classList.remove('next', 'text-blue-500', 'dark:text-blue-400');
                newDigit.classList.add('current', 'text-slate-900', 'dark:text-white');
                newDigit.style.transform = 'none';
            };
        }

        function startFocusMode() {
            remainingSeconds = focusMinutes * 60;
            isPaused = false;

            try {
                if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
                if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
            } catch(e) {}

            const info = soundInfo[selectedSound] || soundInfo['none'];
            document.getElementById('sound-indicator').innerHTML = `<span>${info.icon}</span><span>${info.name}</span>`;
            soundEngine.play(selectedSound);

            // Transisi Deepin Style
            document.getElementById('setup-view').style.transform = 'scale(0.95)';
            document.getElementById('setup-view').style.opacity = '0';
            
            setTimeout(() => {
                document.getElementById('setup-view').classList.add('hidden');
                
                const focusView = document.getElementById('focus-view');
                focusView.classList.remove('hidden');
                focusView.classList.add('flex');
                
                // Trigger reflow
                void focusView.offsetWidth;
                focusView.classList.remove('opacity-0');
                focusView.classList.add('opacity-100');
            }, 300);

            // Reset Odometer
            ['digit-m1', 'digit-m2', 'digit-s1', 'digit-s2'].forEach(id => {
                document.getElementById(id).dataset.value = '';
                document.getElementById(id).innerHTML = '';
            });
            
            updateTimerDisplay();
            clearInterval(timerInterval);
            timerInterval = setInterval(tick, 1000);
            resetControlsFadeTimer();
        }

        function tick() {
            if (isPaused) return;
            remainingSeconds--;
            updateTimerDisplay();
            if (remainingSeconds <= 0) finishFocusSession();
        }

        function updateTimerDisplay() {
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;
            const strMins = String(mins).padStart(2, '0');
            const strSecs = String(secs).padStart(2, '0');

            updateDigit('digit-m1', strMins[0]);
            updateDigit('digit-m2', strMins[1]);
            updateDigit('digit-s1', strSecs[0]);
            updateDigit('digit-s2', strSecs[1]);
            
            document.title = `${strMins}:${strSecs} - Fokus`;
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pause-icon').classList.toggle('hidden', isPaused);
            document.getElementById('play-icon').classList.toggle('hidden', !isPaused);
            isPaused ? soundEngine.stop() : soundEngine.play(selectedSound);
            resetControlsFadeTimer(); // Memastikan navigasi tampil ketika menekan pause
        }

        function toggleMute() {
            const isMuted = soundEngine.toggleMute();
            document.getElementById('sound-on-icon').classList.toggle('hidden', isMuted);
            document.getElementById('sound-off-icon').classList.toggle('hidden', !isMuted);
        }

        function finishFocusSession() {
            clearInterval(timerInterval);
            soundEngine.stop();
            soundEngine.playChime();
            
            const modal = document.getElementById('finish-modal');
            const modalContent = document.getElementById('finish-modal-content');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // Animasi pop masuk
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.classList.add('opacity-100');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeFinishModal() {
            const modal = document.getElementById('finish-modal');
            const modalContent = document.getElementById('finish-modal-content');
            
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                stopFocusMode();
            }, 300);
        }

        function stopFocusMode() {
            clearInterval(timerInterval);
            soundEngine.stop();
            try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch(e) {}
            
            document.title = "Zen Pomodoro";
            
            const focusView = document.getElementById('focus-view');
            focusView.classList.remove('opacity-100');
            focusView.classList.add('opacity-0');
            
            // Kembalikan kursor ke normal jika sebelumnya hilang
            document.body.style.cursor = 'default';
            
            setTimeout(() => {
                focusView.classList.add('hidden');
                focusView.classList.remove('flex');
                
                const setupView = document.getElementById('setup-view');
                setupView.classList.remove('hidden');
                
                setTimeout(() => {
                    setupView.style.transform = 'scale(1)';
                    setupView.style.opacity = '1';
                }, 10);
            }, 500);
        }

        function resetControlsFadeTimer() {
            const bar = document.getElementById('controls-bar');
            bar.classList.remove('opacity-0', 'translate-y-12');
            bar.classList.add('opacity-100', 'translate-y-0');
            
            // Pastikan kursor nampak saat user sedang berinteraksi
            if (!document.getElementById('focus-view').classList.contains('hidden')) {
                document.body.style.cursor = 'default';
            }

            clearTimeout(uiFadeTimeout);
            uiFadeTimeout = setTimeout(() => {
                if (!document.getElementById('focus-view').classList.contains('hidden') && !isPaused) {
                    bar.classList.remove('opacity-100', 'translate-y-0');
                    bar.classList.add('opacity-0', 'translate-y-12');
                    // Sembunyikan kursor tikus (mouse) untuk kebersihan maksimal layar
                    document.body.style.cursor = 'none';
                }
            }, 2500);
        }

        window.addEventListener('mousemove', resetControlsFadeTimer);
        window.addEventListener('touchstart', resetControlsFadeTimer);
    </script>
</body>
</html>
